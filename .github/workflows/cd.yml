name: CD

# ⚠️ THIS PIPELINE IS DELIBERATELY MOCKED ⚠️
#
# It builds the release artifact for real, but publishes nothing and deploys nowhere.
# The deploy job prints the commands it would run instead of running them. See the
# README for what would be needed to make it real.
#
# Triggered by a successful CI run rather than by the push itself, so nothing is ever
# packaged for release unless the build, lint, tests and container smoke test all passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments are not cancelled mid-flight, unlike CI runs.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package
    # workflow_dispatch has no workflow_run payload, hence the explicit event check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive image tag
        id: meta
        run: echo "tag=policy-premium-service:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build release image
        run: docker build -t "${{ steps.meta.outputs.tag }}" .

      - name: Report artifact
        run: |
          {
            echo "### Release artifact"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| Size | $(docker image inspect "${{ steps.meta.outputs.tag }}" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}') |"
            echo "| Digest | \`$(docker image inspect "${{ steps.meta.outputs.tag }}" --format '{{.Id}}')\` |"
            echo
            echo "**Not published.** No registry is configured — see the deploy job."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: deploy to staging (MOCK)
    needs: package
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Everything below prints rather than executes. The commands are the real ones for
      # a container platform, kept accurate so this is a starting point rather than a prop.
      - name: Deploy (mocked)
        env:
          IMAGE: ${{ needs.package.outputs.tag }}
        run: |
          echo "=========================================================="
          echo " MOCK DEPLOYMENT - nothing is published and nothing is"
          echo " deployed. The commands below are printed, not executed."
          echo "=========================================================="
          echo
          echo "Would authenticate to the registry:"
          echo "  echo \$REGISTRY_TOKEN | docker login ghcr.io -u \$ACTOR --password-stdin"
          echo
          echo "Would publish the image:"
          echo "  docker tag  $IMAGE ghcr.io/\$OWNER/$IMAGE"
          echo "  docker push ghcr.io/\$OWNER/$IMAGE"
          echo
          echo "Would roll it out and wait for readiness:"
          echo "  kubectl set image deployment/policy-premium-service app=ghcr.io/\$OWNER/$IMAGE -n staging"
          echo "  kubectl rollout status deployment/policy-premium-service -n staging --timeout=5m"
          echo
          echo "Would verify the deployment before declaring success:"
          echo "  curl -fsS https://staging.example.invalid/actuator/health | grep '\"status\":\"UP\"'"
          echo
          echo "Would roll back automatically on failure:"
          echo "  kubectl rollout undo deployment/policy-premium-service -n staging"

      - name: Record the mock in the run summary
        env:
          IMAGE: ${{ needs.package.outputs.tag }}
        run: |
          {
            echo "### 🚧 Mock deployment"
            echo
            echo "Image \`$IMAGE\` was built but **not published**, and **nothing was deployed**."
            echo
            echo "To make this real, two things are needed:"
            echo "1. A registry and credentials (\`packages: write\` plus a login step), so the"
            echo "   image is published rather than discarded at the end of the job."
            echo "2. A deployment target and its credentials as environment secrets, so the"
            echo "   rollout, health verification and rollback steps can actually run."
            echo
            echo "Everything else — gating on a green CI run, deriving an immutable tag from the"
            echo "commit SHA, building the artifact, and the environment gate — is real."
          } >> "$GITHUB_STEP_SUMMARY"
