name: CI

# Runs on PRs (the only path onto main, since main is protected) and again on main
# after merge. Deliberately not on every branch push: with a PR open, that would run
# the identical commit twice. See README for the rationale.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Split into named steps so a failure is attributable at a glance in the Actions
      # UI. This is for diagnosis, not parallelism - separate jobs would pay the setup
      # cost three times and recompile independently, which costs more than it buys.
      # The daemon persists across steps within the job, so later steps reuse a warm JVM.
      - name: Compile
        run: ./gradlew classes testClasses

      # --continue so spotless and checkstyle both report, rather than stopping at the first.
      - name: Lint
        if: '!cancelled()'
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --continue

      # !cancelled() so a lint failure does not hide test results - one push, full picture.
      - name: Test
        if: '!cancelled()'
        run: ./gradlew test jacocoTestReport

      # Drift guard: the steps above enumerate tasks explicitly, so anything added to
      # `check` later (a new plugin, SpotBugs) would silently go unrun in CI. This
      # delegates to `check` itself as the source of truth. Costs seconds - everything
      # above has already run and is up-to-date - and fails if the two ever diverge.
      - name: Verify full check task
        if: '!cancelled()'
        run: ./gradlew check

      # One artifact carrying both the human-readable HTML and the machine-readable XML
      # the quality job consumes. XML paths are what Quality Monitor parses.
      - name: Upload reports
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: ignore

  # Reporting runs in its own job so the elevated permissions it needs are not granted to
  # the job that compiles and runs third-party Gradle plugins. This job runs no build
  # logic at all - it only reads artifacts and posts results.
  quality:
    name: quality
    needs: verify
    if: '!cancelled()'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: build

      # No `quality-gates` input: quality is monitored and reported, never gated. Coverage
      # is deliberately not a pass/fail criterion here - see README.
      #
      # Patterns target report output directories specifically. A looser `**/checkstyle/*.xml`
      # also matched config/checkstyle/checkstyle.xml - the ruleset, not a report - and
      # aborted grading. Note the action still exits 0 when parsing fails, so a green
      # `quality` check is not by itself proof that the report was produced.
      - name: Report quality
        uses: uhafner/quality-monitor@0100da6973a1498aad89af676852a8c788d397f8 # v4.15.0
        with:
          pr-number: ${{ github.event.pull_request.number }}
          title-metric: line
          config: |
            {
              "tests": {
                "tools": [
                  {
                    "id": "junit",
                    "name": "Unit tests",
                    "pattern": "**/test-results/test/TEST-*.xml"
                  }
                ]
              },
              "analysis": [
                {
                  "name": "Style",
                  "tools": [
                    {
                      "id": "checkstyle",
                      "pattern": "**/reports/checkstyle/*.xml"
                    }
                  ]
                }
              ],
              "coverage": [
                {
                  "name": "JaCoCo",
                  "tools": [
                    {
                      "id": "jacoco",
                      "metric": "line",
                      "sourcePath": "src/main/java",
                      "pattern": "**/reports/jacoco/test/jacocoTestReport.xml"
                    },
                    {
                      "id": "jacoco",
                      "metric": "branch",
                      "sourcePath": "src/main/java",
                      "pattern": "**/reports/jacoco/test/jacocoTestReport.xml"
                    }
                  ]
                }
              ]
            }

  # Builds the deliverable artifact and exercises it. A compile that passes tests is not
  # proof the container works: the image can still be broken by a bad base, a missing
  # layer, or a permissions mistake that no unit test would ever catch.
  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        id: build
        run: |
          docker build -t policy-premium-service:ci .
          echo "digest=$(docker image inspect policy-premium-service:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      # --entrypoint is required: without it the arguments are appended to the image's
      # ENTRYPOINT, which starts the application instead of running `id`, and the step
      # hangs until the job times out.
      - name: Verify the image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id policy-premium-service:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Start container
        run: docker run -d --name pps -p 8080:8080 policy-premium-service:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          exit 1

      - name: Smoke test the API against the running container
        run: |
          status=$(curl -s -o created.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/quotes \
            -H 'Content-Type: application/json' \
            -d '{"coverageType":"AUTO","sumInsured":750000,"region":"MALMO","priorClaimsCount":2}')
          echo "POST status: $status"
          test "$status" = "201"
          jq -e '.premium == 4402.20 and .currency == "SEK"' created.json > /dev/null
          id=$(jq -r '.id' created.json)
          echo "created quote: $id"

          status=$(curl -s -o fetched.json -w '%{http_code}' "http://localhost:8080/api/v1/quotes/$id")
          echo "GET status: $status"
          test "$status" = "200"

          # A retrieved quote must be the stored one, not a fresh calculation.
          diff created.json fetched.json

      # Scans the same image that was just proven to work, rather than a rebuilt one.
      #
      # --ignore-unfixed: fails only on vulnerabilities with a fix available. Failing on
      # unfixable base-image CVEs would block unrelated PRs with no remedy beyond adding a
      # suppression, which trains people to suppress rather than to fix.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: policy-premium-service:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      # Logs are only useful when something went wrong, and only then.
      - name: Container logs
        if: failure()
        run: docker logs pps

      - name: Stop container
        if: always()
        run: docker rm -f pps || true

      # Exports the image that was just smoke-tested and scanned, so the deploy job can
      # promote that exact artifact rather than rebuilding one. A rebuild of the same commit
      # is not the same image: `apk upgrade` in the runtime stage can pull different package
      # versions minutes later.
      #
      # Only on main, since pull requests never deploy and the upload is not free.
      - name: Export tested image
        if: github.ref == 'refs/heads/main'
        run: docker save policy-premium-service:ci | gzip > image.tar.gz

      - name: Upload tested image
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: image.tar.gz
          retention-days: 1

  # ⚠️ DELIBERATELY MOCKED ⚠️
  #
  # Publishes nothing and deploys nowhere. The commands are printed, not executed. See the
  # README for what is needed to make it real.
  #
  # Runs only on main, and only after the image has been built, smoke-tested and scanned.
  deploy:
    name: deploy to staging (MOCK)
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      # .invalid is reserved and never resolves, so nobody mistakes this for a live service.
      url: https://staging.policy-premium.example.invalid
    steps:
      - name: Download tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image

      - name: Load and verify it is the tested artifact
        id: promote
        run: |
          docker load < image.tar.gz
          digest=$(docker image inspect policy-premium-service:ci --format '{{.Id}}')
          echo "tested:   ${{ needs.image.outputs.digest }}"
          echo "promoted: $digest"
          test "$digest" = "${{ needs.image.outputs.digest }}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=policy-premium-service:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Deploy (mocked)
        env:
          IMAGE: ${{ steps.promote.outputs.tag }}
        run: |
          docker tag policy-premium-service:ci "$IMAGE"
          echo "=========================================================="
          echo " MOCK DEPLOYMENT - nothing is published and nothing is"
          echo " deployed. The commands below are printed, not executed."
          echo "=========================================================="
          echo
          echo "Would authenticate to the registry:"
          echo "  echo \$REGISTRY_TOKEN | docker login ghcr.io -u \$ACTOR --password-stdin"
          echo
          echo "Would publish the promoted image:"
          echo "  docker push ghcr.io/\$OWNER/$IMAGE"
          echo
          echo "Would roll it out and wait for readiness:"
          echo "  kubectl set image deployment/policy-premium-service app=ghcr.io/\$OWNER/$IMAGE -n staging"
          echo "  kubectl rollout status deployment/policy-premium-service -n staging --timeout=5m"
          echo
          echo "Would verify the deployment before declaring success:"
          echo "  curl -fsS https://staging.policy-premium.example.invalid/actuator/health"
          echo
          echo "Would roll back automatically on failure:"
          echo "  kubectl rollout undo deployment/policy-premium-service -n staging"

      - name: Record the mock in the run summary
        env:
          IMAGE: ${{ steps.promote.outputs.tag }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          {
            echo "### 🚧 Mock deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Published | **No** — no registry is configured |"
            echo "| Deployed | **No** — no target is configured |"
            echo
            echo "The image above is the **same artifact** that passed the container smoke test"
            echo "and the vulnerability scan in this run — it was promoted, not rebuilt."
            echo
            echo "To make this real, two things are needed:"
            echo "1. A registry and credentials, so the image is published rather than discarded."
            echo "2. A deployment target and its secrets, so the rollout, health verification and"
            echo "   rollback steps can actually run."
            echo
            echo "Everything else — gating on green lint, tests and a scanned container, deriving an"
            echo "immutable tag from the commit SHA, and the environment gate — is real."
          } >> "$GITHUB_STEP_SUMMARY"
