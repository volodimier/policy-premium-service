name: CI

# Runs on PRs (the only path onto main, since main is protected) and again on main
# after merge. Deliberately not on every branch push: with a PR open, that would run
# the identical commit twice. See README for the rationale.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Split into named steps so a failure is attributable at a glance in the Actions
      # UI. This is for diagnosis, not parallelism - separate jobs would pay the setup
      # cost three times and recompile independently, which costs more than it buys.
      # The daemon persists across steps within the job, so later steps reuse a warm JVM.
      - name: Compile
        run: ./gradlew classes testClasses

      # --continue so spotless and checkstyle both report, rather than stopping at the first.
      - name: Lint
        if: '!cancelled()'
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest --continue

      # !cancelled() so a lint failure does not hide test results - one push, full picture.
      - name: Test
        if: '!cancelled()'
        run: ./gradlew test jacocoTestReport

      # Drift guard: the steps above enumerate tasks explicitly, so anything added to
      # `check` later (a new plugin, SpotBugs) would silently go unrun in CI. This
      # delegates to `check` itself as the source of truth. Costs seconds - everything
      # above has already run and is up-to-date - and fails if the two ever diverge.
      - name: Verify full check task
        if: '!cancelled()'
        run: ./gradlew check

      # One artifact carrying both the human-readable HTML and the machine-readable XML
      # the quality job consumes. XML paths are what Quality Monitor parses.
      - name: Upload reports
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/jacoco/test/
            build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: ignore

  # Reporting runs in its own job so the elevated permissions it needs are not granted to
  # the job that compiles and runs third-party Gradle plugins. This job runs no build
  # logic at all - it only reads artifacts and posts results.
  quality:
    name: quality
    needs: verify
    if: '!cancelled()'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: build

      # No `quality-gates` input: quality is monitored and reported, never gated. Coverage
      # is deliberately not a pass/fail criterion here - see README.
      - name: Report quality
        uses: uhafner/quality-monitor@0100da6973a1498aad89af676852a8c788d397f8 # v4.15.0
        with:
          pr-number: ${{ github.event.pull_request.number }}
          title-metric: line
          config: |
            {
              "tests": {
                "tools": [
                  {
                    "id": "junit",
                    "name": "Unit tests",
                    "pattern": "**/TEST-*.xml"
                  }
                ]
              },
              "analysis": [
                {
                  "name": "Style",
                  "tools": [
                    {
                      "id": "checkstyle",
                      "pattern": "**/checkstyle/*.xml"
                    }
                  ]
                }
              ],
              "coverage": [
                {
                  "name": "JaCoCo",
                  "tools": [
                    {
                      "id": "jacoco",
                      "metric": "line",
                      "sourcePath": "src/main/java",
                      "pattern": "**/jacocoTestReport.xml"
                    },
                    {
                      "id": "jacoco",
                      "metric": "branch",
                      "sourcePath": "src/main/java",
                      "pattern": "**/jacocoTestReport.xml"
                    }
                  ]
                }
              ]
            }
